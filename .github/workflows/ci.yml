name: Starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run test:demo
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:starter
      - run: npm test

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:design
      - run: npm run build-storybook
      - run: npm run test:ui
      - run: npm run test:invariant
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-system-failures
          path: test-results/

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run build:showcase
      - run: npm run build:demo
      - run: npm run check:release:packages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-package-failures
          path: test-results/

  highway-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/highway-mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/highway-mcp --ignore-scripts
      - run: npm run check:mcp
      - run: npm run check:dependencies
